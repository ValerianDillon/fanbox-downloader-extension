name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "公開する既存タグ（例: v2.0.0）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-latest
    outputs:
      asset_name: ${{ steps.release.outputs.asset_name }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Determine release metadata
        id: release
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$MANUAL_TAG"
          else
            release_tag="$PUSH_TAG"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "release tag must be v followed by 1 to 4 numeric components: $release_tag" >&2
            exit 1
          fi

          package_version="$(bun -e 'console.log(require("./package.json").version)')"
          if [[ "$release_tag" != "v$package_version" ]]; then
            echo "tag $release_tag does not match package.json version $package_version" >&2
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "$release_tag")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "checked out commit $head_commit does not match $release_tag ($tag_commit)" >&2
            exit 1
          fi

          asset_name="fanbox-downloader-extension-$release_tag.zip"
          {
            printf 'tag=%s\n' "$release_tag"
            printf 'version=%s\n' "$package_version"
            printf 'asset_name=%s\n' "$asset_name"
          } >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:ci

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify built manifest version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          manifest_version="$(bun -e 'console.log(require("./dist/manifest.json").version)')"
          if [[ "$manifest_version" != "$EXPECTED_VERSION" ]]; then
            echo "dist/manifest.json version $manifest_version does not match $EXPECTED_VERSION" >&2
            exit 1
          fi

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Smoke test
        run: bun run test:smoke

      - name: Package extension
        shell: bash
        working-directory: dist
        env:
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release"
          asset_path="$GITHUB_WORKSPACE/release/$ASSET_NAME"
          zip -r "$asset_path" .
          unzip -t "$asset_path"

      - name: Create checksum
        shell: bash
        working-directory: release
        env:
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        run: sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.release.outputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: release

      - name: Publish GitHub Release
        shell: bash
        env:
          ASSET_NAME: ${{ needs.build.outputs.asset_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTICE: |-
            この拡張は非公式であり、ピクシブ株式会社が開発、配布、承認するものではありません。
            利用者自身が正当に閲覧できる投稿を個人用に保存する用途を想定しています。
            アクセス権限の回避や、取得したコンテンツの再配布には使用しないでください。
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          asset_path="release/$ASSET_NAME"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset_path" "$asset_path.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$asset_path" "$asset_path.sha256" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --notes "$RELEASE_NOTICE"
          fi
